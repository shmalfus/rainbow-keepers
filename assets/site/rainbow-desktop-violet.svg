<defs>
<filter xmlns="http://www.w3.org/2000/svg" id="filter3_f_0_45" x="676.134" y="202.889" width="1106.98" height="861.111" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feFlood flood-opacity="0" result="BackgroundImageFix" />
