</g>

<defs>
<filter xmlns="http://www.w3.org/2000/svg" id="filter1_f_0_45" x="227.378" y="0" width="1062" height="857.111" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feFlood flood-opacity="0" result="BackgroundImageFix" />
<feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape" />
<feGaussianBlur stdDeviation="35" result="softLight" />
<!-- Dither the blurred light's alpha; transparent surroundings stay transparent. -->
