<defs>
<filter xmlns="http://www.w3.org/2000/svg" id="filter2_f_0_45" x="663.644" y="87.9556" width="947.556" height="742.667" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
<feFlood flood-opacity="0" result="BackgroundImageFix" />
